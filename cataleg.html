<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catàleg de Models - AC Classics Montgrí</title>
    <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>
    <section id="cataleg" style="padding-top: 120px; background: white;">
        <h2>Catàleg de Models Clàssics</h2>
        <p style="text-align: center; max-width: 700px; margin: 0 auto 30px; font-size: 1.1rem;">
            Compila informació sobre cada model: característiques, accessoris, curiositats i més.<br>
            Comença pels Renault dels anys 70-80 i expandeix-lo lliurement.
        </p>

        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Cerca per model, marca o any (ex: R5, Renault, 1975...)">
        </div>

        <div class="grid" id="modelsGrid"></div>
    </section>

    <!-- Modal -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle" style="margin:0; font-size:2rem;"></h2>
                <span class="close" onclick="closeModal()">×</span>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

        <footer class="footer">
        <p>&copy; 2026 AC Classics Montgrí • Club de Cotxes Clàssics</p>

        <p style="font-size: 0.9rem; opacity: 0.7;">Fet amb passió pels cotxes clàssics europeus</p>
    </footer>

    <script src="./assets/js/script.js"></script>
    <!-- Shared Navigation -->
    <script>
        fetch('assets/components/nav.html')
            .then(response => response.text())
            .then(data => {
                document.body.insertAdjacentHTML('afterbegin', data);
            })
            .catch(err => console.error('Error loading nav:', err));
    </script>

</html>
