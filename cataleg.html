<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catàleg de Models - AC Classics Montgrí</title>
    <link rel="shortcut icon" type="image/x-icon" href="logo.ico">
    <link rel="stylesheet" href="assets/css/style.css">

    <script type="text/javascript">
        (function (c, l, a, r, i, t, y) {
            c[a] = c[a] || function () { (c[a].q = c[a].q || []).push(arguments) };
            t = l.createElement(r); t.async = 1; t.src = "https://www.clarity.ms/tag/" + i;
            y = l.getElementsByTagName(r)[0]; y.parentNode.insertBefore(t, y);
        })(window, document, "clarity", "script", "wlv8n3zfwr");
    </script>
</head>

<body>

    <!-- Shared Navigation -->
    <script>
        fetch('assets/components/nav.html')
            .then(response => response.text())
            .then(data => document.body.insertAdjacentHTML('afterbegin', data))
            .catch(err => console.error('Error loading nav:', err));
    </script>

    <section id="cataleg" style="padding-top: 120px; background: white;">
        <h2>Catàleg de Models Clàssics</h2>
        <p style="text-align: center; max-width: 700px; margin: 0 auto 30px; font-size: 1.1rem;">
            Compila informació sobre cada model: característiques, accessoris, curiositats i més.
        </p>

        <!-- Search Bar -->
        <div class="search-container">
            <input type="text" id="searchInput"
                placeholder="Cerca per model, marca, any, motor, accessori... (ex: R5, Gordini, xassís)">
        </div>

        <!-- Results info -->
        <div id="resultsInfo" style="text-align:center; margin-bottom: 20px; font-size: 1.05rem; color: #555;"></div>

        <!-- Grid of cars -->
        <div class="grid" id="modelsGrid"></div>

        <!-- Load More Button -->
        <div style="text-align: center; margin: 40px 0;">
            <button id="loadMoreBtn" class="btn" style="display: none;">Carrega més models</button>
        </div>
    </section>

    <!-- MODAL (unchanged) -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle" style="margin:0; font-size:2rem;"></h2>
                <span class="close" onclick="closeModal()">×</span>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="assets/js/script.js"></script>
    <script>
        fetch('assets/components/footer.html')
            .then(response => response.text())
            .then(data => document.body.insertAdjacentHTML('beforeend', data))
            .catch(err => console.error('Error loading footer:', err));
    </script>
    <script src="assets/js/menu.js"></script>
</body>

</html>
