<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notícies & Concentracions - AC Classics Montgrí</title>
    <link rel="icon" type="image/x-icon" href="/images/logo.ico">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <section style="padding-top: 120px;" class="noticies">
        <h2>Notícies & Concentracions</h2>
        <p style="text-align: center; max-width: 700px; margin: 0 auto 40px; font-size: 1.1rem;">
            Aquí publicarem les nostres sortides, rutes i moments del club.
        </p>
        <!-- You can add cards here later when you have real news -->
    </section>
    
    <!-- Shared Navigation -->
    <script>
        fetch('assets/components/nav.html')
            .then(response => response.text())
            .then(data => {
                document.body.insertAdjacentHTML('afterbegin', data);
            })
            .catch(err => console.error('Error loading nav:', err));
    </script>

    <!-- Footer -->
    <script>
        fetch('assets/components/footer.html')
            .then(response => response.text())
            .then(data => {
                document.body.insertAdjacentHTML('beforeend', data);
            })
            .catch(err => console.error('Error loading footer:', err));
    </script>

</body>

</html>
