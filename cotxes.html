<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Els Nostres Cotxes - AC Classics Montgrí</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <section id="cotxes" style="padding-top: 120px;">
        <h2>Els Nostres Cotxes Destacats</h2>
        <div class="grid" id="cotxes-grid">
            <!-- Highlighted cars will be loaded here -->
        </div>
    </section>

    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle" style="margin:0; font-size:2rem;"></h2>
                <span class="close" onclick="closeModal()">×</span>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <!-- Shared Navigation -->
    <script>
        fetch('assets/components/nav.html')
            .then(response => response.text())
            .then(data => document.body.insertAdjacentHTML('afterbegin', data))
            .catch(err => console.error('Error loading nav:', err));
    </script>

    <!-- Shared Footer -->
    <script>
        fetch('assets/components/footer.html')
            .then(response => response.text())
            .then(data => document.body.insertAdjacentHTML('beforeend', data))
            .catch(err => console.error('Error loading footer:', err));
    </script>

    <script src="assets/js/script.js"></script>

    <script>
        // Wait until cars are loaded, then show only destacats
        async function showDestacats() {
            // Give time for script.js to finish loading all cars
            await new Promise(resolve => setTimeout(resolve, 600));

            const destacats = window.getCotxesDestacats ?
                window.getCotxesDestacats() : [];

            const container = document.getElementById('cotxes-grid');
            container.innerHTML = '';

            if (destacats.length === 0) {
                container.innerHTML = `
                    <p style="grid-column: 1 / -1; text-align:center; padding:60px; color:#777; font-size:1.1rem;">
                        Encara no hi ha cotxes destacats.<br>
                        Afegeix <code>destacat: true</code> en algun fitxer de cotxe.
                    </p>`;
                return;
            }

            destacats.forEach(model => {
                const cardHTML = `
                    <div class="card" onclick="showModel(${model.id})">
                        <img src="${model.image}" alt="${model.brand} ${model.model}">
                        <div class="card-content">
                            <h3>${model.brand} ${model.model}</h3>
                            <p><strong>${model.years}</strong></p>
                            <p>${model.description}</p>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });
        }

        // Run when page is ready
        window.addEventListener('load', showDestacats);
    </script>

</body>

</html>
