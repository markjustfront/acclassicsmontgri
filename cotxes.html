<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Els Nostres Cotxes - AC Classics Montgrí</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <!-- Shared Navigation -->
    <script>
        fetch('assets/components/nav.html')
            .then(response => response.text())
            .then(data => document.body.insertAdjacentHTML('afterbegin', data))
            .catch(err => console.error('Error loading nav:', err));
    </script>

    <section id="cotxes" style="padding-top: 120px;">
        <h2>Els Nostres Cotxes Destacats</h2>
        <div class="grid" id="cotxes-grid">
            <!-- Cars with destacat: true will be loaded here automatically -->
        </div>
    </section>

    <!-- Shared Footer -->
    <script>
        fetch('assets/components/footer.html')
            .then(response => response.text())
            .then(data => document.body.insertAdjacentHTML('beforeend', data))
            .catch(err => console.error('Error loading footer:', err));
    </script>

    <script src="assets/js/script.js"></script>

    <script>
        async function loadDestacats() {
            // Wait for cars to load
            await new Promise(r => setTimeout(r, 400));

            const destacats = window.getCotxesDestacats ? window.getCotxesDestacats() : [];

            const container = document.getElementById('cotxes-grid');
            container.innerHTML = '';

            if (destacats.length === 0) {
                container.innerHTML = `<p style="grid-column:1/-1; text-align:center; padding:60px; color:#777;">
                Encara no hi ha cotxes destacats definits.
            </p>`;
                return;
            }

            destacats.forEach(model => {
                const html = `
                <div class="card" onclick="showModel(${model.id})">
                    <img src="${model.image}" alt="${model.brand} ${model.model}">
                    <div class="card-content">
                        <h3>${model.brand} ${model.model}</h3>
                        <p><strong>${model.years}</strong></p>
                        <p>${model.description}</p>
                    </div>
                </div>
            `;
                container.innerHTML += html;
            });
        }

        loadDestacats();
    </script>

</body>

</html>
