<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esdeveniments - AC Classics Montgrí</title>
    <link rel="shortcut icon" type="image/x-icon" href="logo.ico">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
</head>

<body>

    <!-- Shared Navigation -->
    <script>
        fetch('assets/components/nav.html')
            .then(response => response.text())
            .then(data => document.body.insertAdjacentHTML('afterbegin', data))
            .catch(err => console.error('Error loading nav:', err));
    </script>

    <section class="events" style="padding-top: 120px;">
        <h2>Esdeveniments de Clàssics (≤70 km)</h2>

        <div class="filter" style="text-align: center; margin-bottom: 40px;">
            <button onclick="filterEvents('all')" class="btn">Tots</button>
            <button onclick="filterEvents('trobada')" class="btn">Trobades</button>
            <button onclick="filterEvents('exposicio')" class="btn">Exposicions</button>
            <button onclick="filterEvents('rally')" class="btn">Rallys</button>
        </div>

        <div id="eventsContainer" class="grid"></div>

        <div id="map" style="height: 420px; margin-top: 60px; border-radius: 16px;"></div>
    </section>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        const events = [ /* your events array stays the same */
            { title: "Fira Sant Andreu", desc: "Exposició de vehicles clàssics i tractors", location: "Torroella de Montgrí", type: "exposicio", status: "Anual", coords: [42.043, 3.127] },
            { title: "Trobada Serra de Daró", desc: "Esmorzar i concentració de clàssics", location: "Serra de Daró", type: "trobada", status: "Mensual", coords: [42.025, 3.071] },
            { title: "Clàssics Verges", desc: "Ruta i exposició al poble", location: "Verges", type: "trobada", status: "Primavera", coords: [42.062, 3.045] },
            { title: "La Bisbal Clàssics", desc: "Gran trobada amb esmorzar", location: "La Bisbal", type: "trobada", status: "Diverses dates", coords: [41.960, 3.041] },
            { title: "Palamós Clàssics", desc: "Exposició al port", location: "Palamós", type: "exposicio", status: "Estiu", coords: [41.848, 3.129] },
            { title: "Figueres Clàssics", desc: "Gran concentració", location: "Figueres", type: "trobada", status: "Diverses dates", coords: [42.267, 2.961] },
            { title: "Rally Costa Brava Històric", desc: "Rally internacional", location: "Girona", type: "rally", status: "Març", coords: [41.979, 2.821] }
        ];

        const container = document.getElementById("eventsContainer");

        function renderEvents(filter = 'all') {
            container.innerHTML = "";
            events
                .filter(e => filter === 'all' || e.type === filter)
                .forEach(e => {
                    container.innerHTML += `
                        <div class="card">
                            <span class="badge ${e.type}">${e.type}</span>
                            <h3>${e.title}</h3>
                            <p>${e.desc}</p>
                            <p><strong>${e.location}</strong></p>
                            <p class="status">${e.status}</p>
                        </div>`;
                });
        }

        function filterEvents(type) {
            renderEvents(type);
        }

        renderEvents();

        // Map
        const map = L.map('map').setView([42.05, 3.05], 10);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        events.forEach(e => {
            L.marker(e.coords).addTo(map).bindPopup(`<b>${e.title}</b><br>${e.location}`);
        });
    </script>

    <!-- Footer -->
    <script>
        fetch('assets/components/footer.html')
            .then(response => response.text())
            .then(data => {
                document.body.insertAdjacentHTML('beforeend', data);
            })
            .catch(err => console.error('Error loading footer:', err));
    </script>
</body>

</html>
